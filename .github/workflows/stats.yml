name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          path: profile-stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=ashd90&show_icons=true&theme=tokyonight&hide_border=true&count_private=true

      - name: Generate Language Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          path: profile-stats/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=ashd90&layout=compact&theme=tokyonight&hide_border=true

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-stats/*.svg
          git commit -m "Update GitHub profile stats" || exit 0
          git push
